name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        node: [22, 24, 26]
        astro: [5, 6, 7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false astro@${{ matrix.astro }}
      - run: npm test
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:stress
      - run: npm audit
      - run: npm install --global pnpm@12.21.0
      - run: npm run test:package
      - run: npm pack --dry-run
